title: Update Portfolio dashboard
description: >
  Request body to update an organization Portfolio dashboard name and description.
  Name length 3–128 (same as project dashboard; no character pattern).
  Description optional, max 256 characters.
  Visibility and owner are not updated via this request.
type: object
properties:
  name:
    type: string
    description: Dashboard display name.
    minLength: 3
    maxLength: 128
  description:
    type: string
    description: Optional dashboard description.
    maxLength: 256
required:
  - name
