title: Create Organization dashboard
description: >
  Request body to create an organization dashboard.
  Name length 3–128 (same as project dashboard; no character pattern).
  Description optional, max 256 characters.
  Organization may have at most 3000 dashboards.
type: object
properties:
  name:
    type: string
    description: Dashboard display name.
    minLength: 3
    maxLength: 128
  description:
    type: string
    description: Optional dashboard description.
    maxLength: 256
  visibility:
    allOf:
      - $ref: ../../enums/dashboardVisibility.yaml
    description: >
      Defaults to `PUBLIC` when omitted. First iteration always creates `PUBLIC` dashboards;
      `PRIVATE` is reserved for a later iteration.
required:
  - name
